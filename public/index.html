    <span id="sauvegarde" class="etat-sauvegarde"></span>
    <button class="icone-btn" id="b-retours" title="Retours de l'IA"><svg class="ic"><use href="#i-bulle"/></svg><span id="nb-retours" class="pastille-nombre cache"></span></button>
    <button class="icone-btn" id="b-aide" title="Raccourcis (?)"><svg class="ic"><use href="#i-aide"/></svg></button>
    <button class="icone-btn" id="b-connexions" title="Connexions : ton IA, ElevenLabs, Google Drive, Treg, Blender"><svg class="ic"><use href="#i-prise"/></svg></button>
    <button class="icone-btn" id="b-reglages" title="Réglages et moteurs"><svg class="ic"><use href="#i-reglages"/></svg></button>
    <button class="btn claude" id="b-claude" title="Écris ce que tu veux : ton IA monte la vidéo à partir de tes rushes"><svg class="ic plein"><use href="#i-etincelle"/></svg><span>Demander à l’IA</span></button>
  </header>

  <main class="atelier">
    <aside id="gauche" class="colonne">
      <nav class="onglets-gauche" id="onglets-gauche">
        <button data-panneau="medias" class="actif"><svg class="ic"><use href="#i-grille"/></svg><span>Médias</span></button>
        <button data-panneau="texte"><svg class="ic"><use href="#i-texte"/></svg><span>Texte</span></button>
        <button data-panneau="habiller"><svg class="ic"><use href="#i-baguette"/></svg><span>Habiller</span></button>
        <button data-panneau="creer" title="Musiques, voix, bruitages, images et vidéos avec ElevenLabs"><svg class="ic"><use href="#i-onde"/></svg><span>Créer</span></button>
        <button data-panneau="ia"><svg class="ic"><use href="#i-case"/></svg><span>Consignes</span></button>
      </nav>
      <div id="p-medias" class="panneau-g">
        <button class="importer-grand" data-a="importer" title="Choisir des vidéos, des sons ou des photos sur ton ordinateur"><svg class="ic"><use href="#i-importer"/></svg><span><b>Importer</b><small>ou glisse tes fichiers ici</small></span></button>
        <div id="grille-medias" class="grille-medias"></div>
      </div>
      <div id="p-texte" class="panneau-g cache">
        <div id="texte-tete"></div>
        <div class="texte-outils">
          <input id="texte-cherche" type="search" placeholder="Chercher un mot…">
          <span id="texte-info" class="dim"></span>
        </div>
        <div id="texte-mots" class="texte-mots"></div>
        <div id="texte-action" class="texte-action cache"></div>
      </div>
      <div id="p-habiller" class="panneau-g cache">
        <div class="bascule-habiller"><div class="segmente" id="bascule-habiller"><button data-hab="style" class="actif">Style du film</button><button data-hab="effets">Effets à poser</button></div></div>
        <div id="p-style" class="panneau-g defile"></div>
        <div id="p-effets" class="panneau-g defile cache"></div>
      </div>
      <div id="p-creer" class="panneau-g defile cache"></div>
      <div id="p-ia" class="panneau-g cache"></div>
    </aside>

    <section id="visionneuse">
      <div class="vis-barre">
        <div class="vis-titre" id="vis-titre"></div>
        <div class="segmente cache" id="vue-switch"><button data-vue="montage" class="actif">Mon montage</button><button data-vue="direct" class="cache" title="Le travail de l’IA, au moment où elle le fait"><i class="point-direct"></i>En direct</button><button data-vue="claude"><svg class="ic plein"><use href="#i-etincelle"/></svg>Vidéo de l’IA</button></div>
        <button class="icone-btn" id="b-zones" title="Montrer les zones que le réseau recouvre (boutons, légende)"><svg class="ic"><use href="#i-telephone"/></svg></button>
        <button class="icone-btn" id="b-cadre" title="Aperçu du recadrage automatique"><svg class="ic"><use href="#i-cadre"/></svg></button>
      </div>
      <div class="ecran" id="ecran">
        <video id="v-rush" playsinline preload="auto"></video>
        <img id="i-fixe" class="fixe cache" alt="">
        <!-- le montage, au format exact de la vidéo finale : ce qu'on voit ici est ce que « Créer la vidéo » fabrique -->
        <div id="scene" class="scene cache">
          <div id="scene-zoom" class="scene-zoom">
            <div id="scene-contenu" class="scene-contenu">
              <video id="v-a" playsinline preload="auto" class="cache"></video>
              <video id="v-b" playsinline preload="auto" class="cache"></video>
              <img id="i-fixe-m" class="cache" alt="">
              <div id="carte" class="carte-ecran cache"></div>
              <video id="v-dessus" playsinline preload="auto" muted class="dessus cache"></video>
              <div id="hab-derriere"></div>
              <canvas id="hab-decoupe" class="hab-decoupe cache"></canvas>
              <div id="hab-milieu"></div>
            </div>
            <div id="hab-devant"></div>
          </div>
          <div id="zones" class="zones cache"></div>
        </div>
        <video id="v-claude" class="v-claude cache" controls playsinline preload="metadata"></video>
        <!-- le rendu de l’IA en direct : ses images arrivent au fur et à mesure -->
        <div id="direct" class="direct cache"><img id="direct-img" class="cache" alt=""><div id="direct-attente" class="direct-attente"></div>
          <div class="direct-haut"><span class="direct-badge"><i class="point-direct"></i>En direct</span><span id="direct-info"></span></div><div class="direct-barre"><i id="direct-jauge"></i></div></div>
        <audio id="a-son" preload="auto"></audio>
        <canvas id="onde-grande" class="onde-grande cache"></canvas>
        <div id="cadre" class="cadre cache"></div>
        <div id="indic-ecran" class="indic-ecran"></div>
        <div id="vide" class="vide"></div>
      </div>
      <canvas id="bande" class="bande"></canvas>
      <div class="transport">
        <div class="tc-grand" id="tc"></div>
        <div class="commandes">
          <button class="icone-btn" data-a="debut" title="Début"><svg class="ic"><use href="#i-debut"/></svg></button>
          <button class="icone-btn" data-a="prec" title="Élément précédent (↑)"><svg class="ic"><use href="#i-prec"/></svg></button>
          <button class="icone-btn" data-a="img-" title="Image précédente (←), une seconde avec Maj"><svg class="ic"><use href="#i-img-moins"/></svg></button>
          <button class="lire" data-a="lire" id="b-lire" title="Lecture / pause (espace)"><svg class="ic plein"><use href="#i-lire"/></svg></button>
          <button class="icone-btn" data-a="img+" title="Image suivante (→), une seconde avec Maj"><svg class="ic"><use href="#i-img-plus"/></svg></button>
          <button class="icone-btn" data-a="suiv" title="Élément suivant (↓)"><svg class="ic"><use href="#i-suiv"/></svg></button>
        </div>
        <div class="actions-lecteur" id="actions-lecteur"></div>
      </div>
    </section>

    <aside id="cote" class="colonne">
      <div id="claude" class="corps-cote claude"></div>
      <div id="inspecteur" class="corps-cote cache"></div>
    </aside>
  </main>

  <section id="chronologie">
    <div class="outils-tl">
      <button class="icone-btn" data-a="annuler" title="Annuler (⌘Z)"><svg class="ic"><use href="#i-annuler"/></svg></button>
      <button class="icone-btn" data-a="refaire" title="Rétablir (⇧⌘Z)"><svg class="ic"><use href="#i-retablir"/></svg></button>
      <span class="sep"></span>
      <button class="outil" data-a="couper" title="Couper le plan à la tête de lecture (S ou ⌘B)"><svg class="ic"><use href="#i-ciseaux"/></svg><span>Couper</span></button>
      <button class="outil" data-a="lame" id="b-lame" title="Mode ciseaux (C) : clique sur un plan pour le couper à cet endroit. V ou Échap pour revenir."><svg class="ic"><use href="#i-lame"/></svg><span>Ciseaux</span></button>
      <button class="outil" data-a="supprimer" title="Supprimer la sélection (⌫)"><svg class="ic"><use href="#i-poubelle"/></svg><span>Supprimer</span></button>
      <span class="sep"></span>
      <button class="outil violet" data-a="case" title="Une case vide que l’IA remplira : scène, titre, carte… (B)"><svg class="ic"><use href="#i-case"/></svg><span>Case IA</span></button>
      <button class="outil jaune" data-a="indication" title="Une note pour l’IA sur un moment du montage (N)"><svg class="ic"><use href="#i-drapeau"/></svg><span>Note IA</span></button>
      <span class="sep"></span>
      <button class="outil rose" data-a="effets" title="Transitions, titres, mouvements et bruitages à glisser sur la timeline"><svg class="ic"><use href="#i-baguette"/></svg><span>Effets</span></button>
      <button class="outil" data-a="sous-titres" id="b-st" title="Sous-titres sur tout le film : un clic pour les mettre ou les enlever (le style se règle dans Habiller)"><svg class="ic"><use href="#i-cc"/></svg><span>Sous-titres</span></button>
      <span class="sep"></span>
      <div class="format-tl" id="format-tl" role="group" aria-label="Format de la vidéo"></div>
      <span class="espace"></span>
      <span class="zoom"><button class="icone-btn" data-a="zoom-" title="Dézoomer (−)"><svg class="ic"><use href="#i-moins"/></svg></button><input id="zoom" type="range" min="0" max="100" value="45" aria-label="Zoom"><button class="icone-btn" data-a="zoom+" title="Zoomer (+)"><svg class="ic"><use href="#i-plus"/></svg></button></span>
      <button class="icone-btn" data-a="tout" title="Tout voir (0)"><svg class="ic"><use href="#i-tout"/></svg></button>
    </div>
    <div id="tl" class="tl">
      <div id="tl-interieur" class="tl-interieur">
        <div id="regle" class="regle"></div>
        <div id="piste-indic" class="piste piste-indic"></div>
        <div id="piste-dessus" class="piste piste-dessus"></div>
        <div id="piste-montage" class="piste piste-montage"></div>
        <div id="piste-claude" class="piste piste-claude cache"></div>
        <div id="tete" class="tete"></div>
        <div id="fin-montage" class="fin-montage cache"></div>
        <div id="insertion" class="insertion cache"></div>
        <div id="guide-aimant" class="guide-aimant cache"></div>
        <div id="guide-lame" class="guide-lame cache"></div>
      </div>
    </div>
  </section>
</div>

<div id="voile" class="voile cache"><div id="feuille" class="feuille"></div></div>
<div id="bulle" class="bulle cache"></div>
<div id="notes" class="notes"></div>
<div id="depot" class="depot cache"><svg class="cadre-depot" aria-hidden="true"><rect x="14" y="14" width="96%" height="94%" rx="22"/></svg><div><svg class="ill" viewBox="0 0 160 120" aria-hidden="true"><use href="#ill-rushes"/></svg><b>Lâche tout ici</b><small>Vidéos, sons, photos : ils restent à leur place sur ton ordinateur, même très lourds.<br>Sur la timeline, ils se posent là où tu lâches.</small></div></div>
<input type="file" id="f-pieces" multiple hidden>
<script type="module" src="/app.js"></script>
</body>
</html>
