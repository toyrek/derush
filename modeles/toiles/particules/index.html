<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Particules</title>
<script type="importmap">{"imports": {"three": "/lib/three/build/three.module.js", "three/addons/": "/lib/three/examples/jsm/", "three.quarks": "/lib/three.quarks/dist/three.quarks.esm.js", "quarks.core": "/lib/quarks.core/dist/quarks.core.esm.js"}}</script>
<style>
  html, body { margin: 0; background: #07080b; overflow: hidden; }
</style>
</head>
<body>
<canvas id="toile"></canvas>
<script type="module">
// three.js (MIT) dessine en 3D ; three.quarks (MIT, https://github.com/Alchemist0823/three.quarks) fait les particules.
// Des particules sont une SIMULATION : chaque image dépend de la précédente. La toile le dit (suite: true) : Dérush la
// rend dans l'ordre, et renderAt(t) rejoue tout depuis zéro si le temps recule. Le pas de calcul est fixe (1/60 s) et
// le hasard a une graine : deux rendus donnent les mêmes images.
import * as THREE from 'three';
import {BatchedRenderer, ParticleSystem, ConstantValue, IntervalValue, ColorRange, ConeEmitter, PointEmitter, RenderMode, SizeOverLife, ColorOverLife, PiecewiseBezier, Bezier, Gradient, ApplyForce, Noise, Vector3 as V3, Vector4 as V4} from 'three.quarks';
import {preparer, pret, graine, rampe, courbes, bruit} from './toile.js';

// ——— LA PARTITION ———
const {toile, canvas, L, H} = preparer({duree: 8, fps: 30, largeur: 1920, hauteur: 1080, suite: true, contexte: null});
const GRAINE = 7;
const PAS = 1 / 60;                 // le pas de la simulation : toujours le même, quelles que soient les images par seconde
const T = {eclat: 3.0};             // à 3,0 s : une gerbe d'étincelles
const COULEURS = {fond: 0x07080b, braise: [1.0, 0.45, 0.12], coeur: [1.0, 0.86, 0.55], cendre: [0.55, 0.12, 0.05]};

const rendu = new THREE.WebGLRenderer({canvas, antialias: true, preserveDrawingBuffer: true});
rendu.setPixelRatio(1);
rendu.setSize(L, H, false);
rendu.setClearColor(COULEURS.fond, 1);
const camera = new THREE.PerspectiveCamera(38, L / H, 0.1, 100);

// un point lumineux doux, dessiné une fois : la « texture » de chaque particule
function pointDoux() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.25, 'rgba(255,255,255,0.55)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g;
  x.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const TEXTURE = pointDoux();

let scene, lot, braises, etincelles, halo, pas;
function monter() {
  // tout est reconstruit, avec la même graine : la simulation repart exactement du même état
  graine(GRAINE);
  scene = new THREE.Scene();
  lot = new BatchedRenderer();
  scene.add(lot);
  const matiere = () => new THREE.MeshBasicMaterial({map: TEXTURE, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false});
  const [r, v, b] = COULEURS.braise;
  const [r2, v2, b2] = COULEURS.coeur;
  const [r3, v3, b3] = COULEURS.cendre;
  // les braises : un filet continu qui monte, poussé par un vent qui tourne
  braises = new ParticleSystem({
    duration: 10, looping: true, worldSpace: true,
    startLife: new IntervalValue(2.2, 4.2),
    startSpeed: new IntervalValue(0.5, 1.6),
    startSize: new IntervalValue(0.07, 0.24),
    startColor: new ColorRange(new V4(r, v, b, 1), new V4(r2, v2, b2, 1)),
    emissionOverTime: new ConstantValue(210),
    shape: new ConeEmitter({radius: 0.55, arc: Math.PI * 2, thickness: 1, angle: 0.22}),
    material: matiere(), renderMode: RenderMode.BillBoard,
    behaviors: [
      new ApplyForce(new V3(0.25, 1, 0), new ConstantValue(0.55)),
      new Noise(new ConstantValue(0.45), new ConstantValue(0.9)),
      new SizeOverLife(new PiecewiseBezier([[new Bezier(0.6, 1, 0.8, 0), 0]])),
      new ColorOverLife(new Gradient([[new V3(r2, v2, b2), 0], [new V3(r, v, b), 0.35], [new V3(r3, v3, b3), 1]], [[1, 0], [0.9, 0.6], [0, 1]])),
    ],
  });
  braises.emitter.rotation.x = -Math.PI / 2;      // le cône pointe vers le haut
  braises.emitter.position.set(0, -1.35, 0);
  lot.addSystem(braises);
  scene.add(braises.emitter);
  // les étincelles : une seule gerbe, à T.eclat
  etincelles = new ParticleSystem({
    duration: 1, looping: false, worldSpace: true,
    startLife: new IntervalValue(0.7, 1.6),
    startSpeed: new IntervalValue(2.5, 7),
    startSize: new IntervalValue(0.05, 0.14),
    startColor: new ColorRange(new V4(1, 0.95, 0.8, 1), new V4(r2, v2, b2, 1)),
    emissionOverTime: new ConstantValue(0),
    emissionBursts: [{time: 0, count: new ConstantValue(260), cycle: 1, interval: 0.01, probability: 1}],
    shape: new PointEmitter(),
    material: matiere(), renderMode: RenderMode.BillBoard,
    behaviors: [
      new ApplyForce(new V3(0, -1, 0), new ConstantValue(3.2)),
      new SizeOverLife(new PiecewiseBezier([[new Bezier(1, 0.9, 0.5, 0), 0]])),
      new ColorOverLife(new Gradient([[new V3(1, 0.95, 0.8), 0], [new V3(r, v, b), 0.5], [new V3(r3, v3, b3), 1]], [[1, 0], [1, 0.5], [0, 1]])),
    ],
  });
  etincelles.emitter.position.set(0, -0.4, 0);
  etincelles.pause();
  lot.addSystem(etincelles);
  scene.add(etincelles.emitter);
  // une lueur au pied des braises : elle donne de la profondeur et le fond n'est jamais un aplat mort
  halo = new THREE.Sprite(new THREE.SpriteMaterial({map: TEXTURE, color: new THREE.Color(r, v * 0.8, b), blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, opacity: 0.3}));
  halo.position.set(0, -1.2, -0.6);
  halo.scale.set(7, 4.2, 1);
  scene.add(halo);
  pas = 0;
}

function avancerJusqua(t) {
  const cible = Math.round(t / PAS);
  if (!scene || cible < pas) monter();                // le temps recule : on rejoue depuis zéro
  while (pas < cible) {
    if (pas === Math.round(T.eclat / PAS)) etincelles.restart();
    lot.update(PAS);
    pas++;
  }
}

window.renderAt = (t) => {
  avancerJusqua(t);
  // la caméra, elle, est une fonction pure du temps : elle avance doucement et respire
  const recul = rampe(t, 0, toile.duree, 6.4, 5.2, courbes.aller);
  camera.position.set(0.5 * bruit(t * 0.15, 1), 0.25 + 0.15 * bruit(t * 0.12, 2), recul);
  camera.lookAt(0, 0.25, 0);
  // la lueur respire, et s'emballe un instant à la gerbe
  halo.material.opacity = 0.26 + 0.07 * bruit(t * 1.7, 3) + 0.5 * Math.max(0, 1 - Math.abs(t - T.eclat - 0.08) / 0.35) ** 2;
  rendu.render(scene, camera);
};

pret();
</script>
</body>
</html>
